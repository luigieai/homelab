# SteamAuth Docker Compose - prebuilt images from the internal registry
#
# USAGE:
#   cp .env.example .env && edit .env, then:
#   docker compose up -d
services:
  backend:
    image: registry.lab.marioverde.com.br/steamauth-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    volumes:
      - ${DATA_PATH:-./data}:/app/data
    networks:
      - steamauth_network

  frontend:
    image: registry.lab.marioverde.com.br/steamauth-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      NUXT_PUBLIC_API_BASE_URL: http://backend:3000
    networks:
      - steamauth_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.steamauth.rule=Host(`steamauth.app.marioverde.com.br`) || Host(`steamauth.lab.marioverde.com.br`)"
      - "traefik.http.routers.steamauth.entrypoints=websecure"
      - "traefik.http.routers.steamauth.tls.certresolver=cloudflare"
      - "traefik.http.services.steamauth.loadbalancer.server.port=3000"

networks:
  steamauth_network:
    driver: bridge
