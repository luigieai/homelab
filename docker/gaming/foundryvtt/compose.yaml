services:
  foundryvtt:
    image: ghcr.io/felddy/foundryvtt:release
    container_name: foundryvtt
    hostname: foundryvtt
    restart: unless-stopped
    environment:
      - FOUNDRY_USERNAME=${FOUNDRY_USERNAME}
      - FOUNDRY_PASSWORD=${FOUNDRY_PASSWORD}
      - FOUNDRY_ADMIN_KEY=${FOUNDRY_ADMIN_KEY}
      - TZ=America/Sao_Paulo
      - FOUNDRY_TELEMETRY=false
    volumes:
      - foundry_data:/data
    networks:
      - gaming_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.foundryvtt.rule=Host(`foundryvtt.lab.marioverde.com.br`)"
      - "traefik.http.routers.foundryvtt.entrypoints=websecure"
      - "traefik.http.routers.foundryvtt.tls.certresolver=cloudflare"
      - "traefik.http.services.foundryvtt.loadbalancer.server.port=30000"
      - "homelab.wan-expose=true"

networks:
  gaming_network:
    driver: bridge

volumes:
  foundry_data:
