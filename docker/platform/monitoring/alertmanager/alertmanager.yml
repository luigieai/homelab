## Telegram credentials are read from files, never from this (public) repo.
## On docker01:
##   /etc/komodo/secrets/telegram_bot_token   (0600, no trailing newline)
##   /etc/komodo/secrets/telegram_chat_id     (0600, no trailing newline)

global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager-secrets/telegram_bot_token
        chat_id_file: /etc/alertmanager-secrets/telegram_chat_id
        parse_mode: HTML
        send_resolved: true
